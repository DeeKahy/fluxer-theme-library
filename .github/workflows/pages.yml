name: Deploy site

on:
  push:
    branches: [main]
  # The publish workflow commits theme ids back to main using GITHUB_TOKEN, and
  # GitHub deliberately does not let a GITHUB_TOKEN push start another workflow.
  # Without this the site would keep serving an index with no share links in it.
  workflow_run:
    workflows: ['Publish share links']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # On a workflow_run, github.sha points at the commit that started the
      # publish workflow, which is the one *before* the ids were committed.
      # Take main explicitly so the deploy includes them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # themes/index.json is gitignored. A static page cannot list a directory,
      # so the index is built here and shipped with the site.
      - name: Build the theme index
        run: node scripts/build-index.mjs

      # The runner images ship Chrome. Say which one out loud, because a
      # missing browser here shows up as blank share cards rather than as an
      # obvious failure.
      - name: Find Chrome
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      # One 1200x630 render per theme, plus one of the gallery. These are what
      # the per theme pages point og:image at, so a link posted in chat shows
      # the theme instead of a grey text card.
      - name: Render the share cards
        run: node scripts/render-previews.mjs

      # A real page per theme, with a real title, description and card. The
      # gallery is one JavaScript rendered document and unfurlers do not run
      # JavaScript, so without these every theme link looks identical.
      - name: Build the theme pages
        run: node scripts/build-pages.mjs

      # Versions the stylesheet and script URLs so a returning visitor cannot be
      # served yesterday's JavaScript against today's markup. Runs against this
      # checkout only, nothing is committed back.
      - name: Version the asset URLs
        run: node scripts/stamp-assets.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
