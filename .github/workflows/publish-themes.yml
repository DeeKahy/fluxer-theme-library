name: Publish share links

# Uploads new or changed stylesheets to Fluxer's share endpoint and commits the
# returned ids back into theme.json, which is what makes the "Open in Fluxer"
# button appear on the site.
#
# Setup, one time:
#   1. Log into Fluxer with an ordinary user account. A bot account will not
#      work, the endpoint rejects them.
#   2. Copy that account's session token.
#   3. Add it as a repository secret named FLUXER_TOKEN.
#
# Without the secret this job exits quietly and the site falls back to Copy CSS
# and Download, both of which work with no token at all.
#
# Uploads are permanent. Fluxer has no delete endpoint, so every published
# version stays on their CDN. The script only uploads a stylesheet whose
# contents changed, tracked by fluxerThemeHash.

on:
  push:
    branches: [main]
    paths:
      - 'themes/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify checks the token and uploads nothing. publish uploads changed stylesheets, which is permanent.'
        type: choice
        options: [verify, publish]
        default: verify

permissions:
  contents: write

concurrency:
  group: publish-themes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed so the guard below can diff against the commit this push
          # started from.
          fetch-depth: 0

      # The publish step below runs with write access to this repository and a
      # Fluxer account token in the environment. A push that changes a theme is
      # the expected case. A push that changes a theme *and* a script or a
      # workflow is the shape a supply chain attack takes, so stop and make
      # somebody look at it. Publish by hand with workflow_dispatch once the
      # change has been reviewed.
      - name: Refuse to publish a push that touched more than themes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "$AFTER^" 2>/dev/null || true)"
          fi
          if [ -z "$BEFORE" ]; then
            echo "Cannot work out what this push changed. Refusing to publish."
            exit 1
          fi
          outside="$(git diff --name-only "$BEFORE" "$AFTER" -- . ':(exclude)themes/**')"
          if [ -n "$outside" ]; then
            echo "This push changed files outside themes/:"
            echo "$outside"
            echo
            echo "Publishing is blocked. Review the change, then run this workflow"
            echo "by hand with mode=publish."
            exit 1
          fi
          echo "Only themes/ changed, carrying on."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the token
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        env:
          FLUXER_TOKEN: ${{ secrets.FLUXER_TOKEN }}
        run: node scripts/publish-themes.mjs --verify

      - name: Publish changed stylesheets
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        env:
          FLUXER_TOKEN: ${{ secrets.FLUXER_TOKEN }}
        run: node scripts/publish-themes.mjs

      - name: Commit the ids
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'publish'
        run: |
          if [ -z "$(git status --porcelain themes)" ]; then
            echo "No new ids to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add themes
          git commit -m "Record Fluxer share ids for changed themes"
          git push
